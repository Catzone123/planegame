<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyansh's Minecraft Plane Game - Airport & Landing Gear</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        /* Minecraft-Style HUD Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            pointer-events: none;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #3c3c3c;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            box-shadow: inset -3px -3px 0px #202020, inset 3px 3px 0px #555555;
        }

        #flight-status {
            margin-top: 8px;
            color: #ffeb3b;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 1px 1px 0 #000;
        }

        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #controls-overlay {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #555;
            padding: 6px 16px;
            text-align: center;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-panel">
            <span>REYANSH'S PLANEGAME - STAGE 1 [AIRPORT EDITION]</span>
            <span>SCORE: <span id="score">004500</span> | LIVES: <span id="lives">3</span></span>
        </div>
        <div id="flight-status" class="hud-panel" style="border-top: none;">
            <span>STATUS: <span id="status-text">GROUNDED ON RUNWAY</span></span>
            <span>LANDING GEAR: <span id="gear-status">DOWN 🛞</span></span>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="controls-overlay">
        🧱 <b>Flight Controls:</b> <b>W/S</b> (Throttle / Pitch) | <b>A/D</b> (Roll) | <b>Q/E</b> (Rudder) | <b>G</b> (Toggle Landing Gear) | <b>SPACE</b> (Shoot)
    </div>
</div>

<script>
// --- THREE.JS VOXEL SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee); // Minecraft Sky Blue
scene.fog = new THREE.Fog(0x7ec0ee, 80, 300);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(0.5);
document.getElementById('game-container').appendChild(renderer.domElement);

// Minecraft Sunlight
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(100, 200, 50);
scene.add(sunLight);

// --- BLOCK MATERIALS ---
function createBlockMaterial(colorHex) {
    return new THREE.MeshLambertMaterial({ color: colorHex, flatShading: true });
}

const grassTopMat = createBlockMaterial(0x5b8731);
const runwayMat   = createBlockMaterial(0x3c3c3c); // Asphalt Grey
const stripeMat   = createBlockMaterial(0xffffff); // White stripes
const oakWoodMat  = createBlockMaterial(0x674a27);
const ironMat     = createBlockMaterial(0x8e8e8e);
const blackRubber = createBlockMaterial(0x111111);
const glassMat    = new THREE.MeshLambertMaterial({ color: 0x99d9ea, transparent: true, opacity: 0.6, flatShading: true });

// --- BUILD MINECRAFT FPV COCKPIT & LANDING GEAR ---
const cockpitGroup = new THREE.Group();

// Dashboard
const dashGeo = new THREE.BoxGeometry(3, 1, 1.2);
const dashboard = new THREE.Mesh(dashGeo, oakWoodMat);
dashboard.position.set(0, -0.6, -1);
cockpitGroup.add(dashboard);

// Glass Frame
const frameGeo = new THREE.BoxGeometry(0.15, 1.8, 2);
const leftFrame = new THREE.Mesh(frameGeo, ironMat);
leftFrame.position.set(-1.4, 0.2, -0.8);
const rightFrame = leftFrame.clone();
rightFrame.position.x = 1.4;
cockpitGroup.add(leftFrame, rightFrame);

const glassPanel = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.6, 0.1), glassMat);
glassPanel.position.set(0, 0.3, -1.8);
cockpitGroup.add(glassPanel);

// 3D Landing Gear Wheels (Attachable below cockpit)
const landingGearGroup = new THREE.Group();

const strutGeo = new THREE.BoxGeometry(0.2, 1.2, 0.2);
const wheelGeo = new THREE.BoxGeometry(0.6, 0.6, 0.3);

// Left Wheel
const leftStrut = new THREE.Mesh(strutGeo, ironMat);
leftStrut.position.set(-1.2, -1.2, -0.5);
const leftWheel = new THREE.Mesh(wheelGeo, blackRubber);
leftWheel.position.set(-1.2, -1.8, -0.5);
landingGearGroup.add(leftStrut, leftWheel);

// Right Wheel
const rightStrut = new THREE.Mesh(strutGeo, ironMat);
rightStrut.position.set(1.2, -1.2, -0.5);
const rightWheel = new THREE.Mesh(wheelGeo, blackRubber);
rightWheel.position.set(1.2, -1.8, -0.5);
landingGearGroup.add(rightStrut, rightWheel);

cockpitGroup.add(landingGearGroup);
scene.add(cockpitGroup);

// Lock Camera inside Cockpit
camera.position.set(0, 0.2, 0);
cockpitGroup.add(camera);

// --- VOXEL TERRAIN & AIRPORT RUNWAY BUILDER ---
const terrainGroup = new THREE.Group();
const cubeGeo = new THREE.BoxGeometry(4, 4, 4);

const GROUND_Y = -12; // Base ground height

// Generate Voxel Ground + Airport Runway
for (let x = -80; x <= 80; x += 4) {
    for (let z = -300; z <= 100; z += 4) {
        let isRunway = (x >= -12 && x <= 12); // Airport Runway Width
        let isStripe = (x === 0 && (Math.abs(z) % 16 < 8));

        let mat = isRunway ? (isStripe ? stripeMat : runwayMat) : grassTopMat;
        let height = isRunway ? GROUND_Y : GROUND_Y + Math.floor(Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2) * 4;

        const block = new THREE.Mesh(cubeGeo, mat);
        block.position.set(x, height, z);
        terrainGroup.add(block);
    }
}
scene.add(terrainGroup);

// Set plane initially on Runway
cockpitGroup.position.set(0, GROUND_Y + 3.8, 50);

// --- FLIGHT & LANDING MECHANICS STATE ---
let gearDown = true;
let isGrounded = true;
let currentSpeed = 0;
let maxSpeed = 1.4;
let controls = { pitch: 0, roll: 0, yaw: 0 };
const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;

    // Toggle Landing Gear ('G')
    if (e.code === 'KeyG') {
        gearDown = !gearDown;
        landingGearGroup.visible = gearDown;
        document.getElementById('gear-status').innerText = gearDown ? "DOWN 🛞" : "RETRACTED ✈️";
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// --- GAME LOOP ---
function animate() {
    requestAnimationFrame(animate);

    // Throttle & Takeoff Mechanics
    if (keys['KeyW'] || keys['ArrowUp']) {
        currentSpeed = THREE.Math.lerp(currentSpeed, maxSpeed, 0.02);
    } else if (keys['KeyS'] || keys['ArrowDown']) {
        currentSpeed = THREE.Math.lerp(currentSpeed, 0, 0.02);
    }

    // Elevator / Pitch Control
    if (currentSpeed > 0.5) {
        if (keys['KeyW']) controls.pitch = THREE.Math.lerp(controls.pitch, 0.025, 0.1);
        else if (keys['KeyS']) controls.pitch = THREE.Math.lerp(controls.pitch, -0.025, 0.1);
        else controls.pitch = THREE.Math.lerp(controls.pitch, 0, 0.05);

        if (keys['KeyA']) controls.roll = THREE.Math.lerp(controls.roll, 0.035, 0.1);
        else if (keys['KeyD']) controls.roll = THREE.Math.lerp(controls.roll, -0.035, 0.1);
        else controls.roll = THREE.Math.lerp(controls.roll, 0, 0.05);
    }

    cockpitGroup.rotation.z = controls.roll;
    cockpitGroup.rotation.x = controls.pitch;

    // Move Plane forward
    const forward = new THREE.Vector3(0, 0, -currentSpeed).applyQuaternion(cockpitGroup.quaternion);
    cockpitGroup.position.add(forward);

    // Landing / Ground Collision Physics
    const runwayHeight = GROUND_Y + (gearDown ? 3.8 : 2.0);

    if (cockpitGroup.position.y <= runwayHeight) {
        cockpitGroup.position.y = runwayHeight; // Clamp to runway ground level
        
        // Check Landing Conditions
        if (!gearDown && currentSpeed > 0.3) {
            // CRASHED if landing without gear
            document.getElementById('status-text').innerText = "💥 CRASHED! (NO LANDING GEAR)";
            currentSpeed = 0;
        } else if (currentSpeed < 0.2) {
            isGrounded = true;
            document.getElementById('status-text').innerText = "PARKED / READY FOR TAKEOFF";
        } else {
            isGrounded = true;
            document.getElementById('status-text').innerText = "TOUCHDOWN / ROLLING ON RUNWAY";
        }
    } else {
        isGrounded = false;
        document.getElementById('status-text').innerText = "AIRBORNE IN FLIGHT ☁️";
    }

    // Keep ground tile relative to player
    terrainGroup.position.z = cockpitGroup.position.z - (cockpitGroup.position.z % 4);

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
