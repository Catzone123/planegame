<!DOCTYPE.HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL RETRO FLIGHT</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      overflow: hidden;
      background-color: #050014;
      font-family: 'Press Start 2P', monospace;
      user-select: none;
    }

    canvas {
      width: 100vw !important;
      height: 100vh !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.4) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
    }

    #ui {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #00f0ff;
      font-size: 18px;
      text-shadow: 3px 3px 0px #ff007f;
      pointer-events: none;
      z-index: 5;
      letter-spacing: 2px;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 0, 30, 0.9);
      color: #ff007f;
      z-index: 20;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 4px 4px 0px #00f0ff;
      text-align: center;
      line-height: 1.4;
    }

    p {
      font-size: 12px;
      margin-bottom: 30px;
      color: #00f0ff;
      text-shadow: 2px 2px 0px #ff007f;
      text-align: center;
      line-height: 1.6;
    }

    button {
      padding: 16px 28px;
      font-size: 14px;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      background: #ff007f;
      border: 4px solid #00f0ff;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000;
      transition: all 0.1s ease-in-out;
      text-transform: uppercase;
    }

    button:hover {
      background: #00f0ff;
      color: #000;
      box-shadow: 6px 6px 0px #ff007f;
      transform: translate(-2px, -2px);
    }

    #gameOverScreen {
      display: none;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <div id="ui">SCORE: <span id="score">000000</span></div>

  <!-- Start Screen -->
  <div id="startScreen" class="screen">
    <h1>CYBER FLIGHT<br>1984</h1>
    <p>[WASD / ARROWS] TO FLY</p>
    <button onclick="startGame()">PRESS START</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="screen">
    <h1 style="color: #ff3333; text-shadow: 4px 4px 0px #ff007f;">GAME OVER</h1>
    <p>FINAL SCORE: <span id="finalScore">0</span></p>
    <button onclick="startGame()">TRY AGAIN</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    let scene, camera, renderer;
    let planeGroup, gridHelper1, gridHelper2;
    let obstacles = [];
    let gameRunning = false;
    let score = 0;
    let speed = 1.8;
    let targetX = 0, targetY = 0;

    const PIXEL_SCALE = 0.25; 

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };

    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a001a);
      scene.fog = new THREE.FogExp2(0x10002b, 0.006);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(window.innerWidth * PIXEL_SCALE, window.innerHeight * PIXEL_SCALE, false);
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xff00ff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ffff, 1.5);
      dirLight.position.set(0, 50, -50);
      scene.add(dirLight);

      createEnvironment();
      createAirplane();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
      window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });
    }

    function createEnvironment() {
      gridHelper1 = new THREE.GridHelper(3000, 100, 0xff007f, 0xff007f);
      gridHelper1.position.y = -20;
      scene.add(gridHelper1);

      gridHelper2 = new THREE.GridHelper(3000, 100, 0xff007f, 0xff007f);
      gridHelper2.position.y = -20;
      gridHelper2.position.z = -3000;
      scene.add(gridHelper2);

      const sunGeo = new THREE.CircleGeometry(160, 32);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xff0055, side: THREE.DoubleSide });
      const sun = new THREE.Mesh(sunGeo, sunMat);
      sun.position.set(0, 40, -800);
      scene.add(sun);
    }

    function createAirplane() {
      planeGroup = new THREE.Group();

      const bodyMat = new THREE.MeshPhongMaterial({ color: 0x220033, flatShading: true });
      const wingMat = new THREE.MeshPhongMaterial({ color: 0x00f0ff, flatShading: true });
      const tailMat = new THREE.MeshPhongMaterial({ color: 0xff007f, flatShading: true });

      const bodyGeo = new THREE.ConeGeometry(1, 4, 6);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.x = Math.PI / 2;
      planeGroup.add(body);

      const wingGeo = new THREE.BoxGeometry(7, 0.1, 1.5);
      const wings = new THREE.Mesh(wingGeo, wingMat);
      wings.position.set(0, 0, 0.2);
      planeGroup.add(wings);

      const tailGeo = new THREE.BoxGeometry(0.1, 1.5, 1);
      const tail = new THREE.Mesh(tailGeo, tailMat);
      tail.position.set(0, 0.8, -1.5);
      planeGroup.add(tail);

      scene.add(planeGroup);
    }

    function spawnObstacle() {
      const geo = new THREE.BoxGeometry(Math.random() * 4 + 3, Math.random() * 4 + 3, Math.random() * 4 + 3);
      const mat = new THREE.MeshPhongMaterial({ color: 0xff007f, flatShading: true, wireframe: true });
      const mesh = new THREE.Mesh(geo, mat);

      mesh.position.x = (Math.random() - 0.5) * 40;
      mesh.position.y = (Math.random() - 0.5) * 25 + 5;
      mesh.position.z = planeGroup.position.z - 250;

      scene.add(mesh);
      obstacles.push(mesh);
    }

    function startGame() {
      obstacles.forEach(obs => scene.remove(obs));
      obstacles = [];

      planeGroup.position.set(0, 0, 0);
      targetX = 0;
      targetY = 0;
      score = 0;
      speed = 1.8;

      scoreEl.textContent = '000000';
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';

      gameRunning = true;
      animate();
    }

    function animate() {
      if (!gameRunning) return;

      requestAnimationFrame(animate);

      planeGroup.position.z -= speed;
      speed += 0.0004;

      score = Math.floor(-planeGroup.position.z);
      scoreEl.textContent = String(score).padStart(6, '0');

      gridHelper1.position.z = planeGroup.position.z - (planeGroup.position.z % 3000);
      gridHelper2.position.z = gridHelper1.position.z - 3000;

      const moveSpeed = 0.8;
      if (keys.ArrowLeft || keys.a) targetX -= moveSpeed;
      if (keys.ArrowRight || keys.d) targetX += moveSpeed;
      if (keys.ArrowUp || keys.w) targetY += moveSpeed;
      if (keys.ArrowDown || keys.s) targetY -= moveSpeed;

      targetX = Math.max(-22, Math.min(22, targetX));
      targetY = Math.max(-10, Math.min(20, targetY));

      planeGroup.position.x += (targetX - planeGroup.position.x) * 0.1;
      planeGroup.position.y += (targetY - planeGroup.position.y) * 0.1;

      planeGroup.rotation.z = (planeGroup.position.x - targetX) * 0.08;
      planeGroup.rotation.x = (targetY - planeGroup.position.y) * 0.05;

      camera.position.x = planeGroup.position.x * 0.4;
      camera.position.y = planeGroup.position.y * 0.4 + 3;
      camera.position.z = planeGroup.position.z + 10;
      camera.lookAt(planeGroup.position.x, planeGroup.position.y, planeGroup.position.z - 10);

      if (Math.random() < 0.25) spawnObstacle();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.rotation.x += 0.03;
        obs.rotation.y += 0.03;

        if (planeGroup.position.distanceTo(obs.position) < 3.0) {
          endGame();
          return;
        }

        if (obs.position.z > camera.position.z) {
          scene.remove(obs);
          obstacles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    function endGame() {
      gameRunning = false;
      finalScoreEl.textContent = score;
      gameOverScreen.style.display = 'flex';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth * PIXEL_SCALE, window.innerHeight * PIXEL_SCALE, false);
    }

    init();
  </script>
</body>
</html>
