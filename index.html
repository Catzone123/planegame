<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL RETRO FLIGHT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #ffffff;
            font-size: 18px;
            text-shadow: 2px 2px 0px #000000;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 2px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 25, 35, 0.85);
            color: #ffffff;
            z-index: 20;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #2d3748;
            text-align: center;
            line-height: 1.4;
            color: #48bb78;
        }

        p {
            font-size: 12px;
            margin-bottom: 30px;
            color: #e2e8f0;
            text-shadow: 1px 1px 0px #000000;
            text-align: center;
            line-height: 1.6;
        }

        button {
            padding: 16px 28px;
            font-size: 14px;
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
            background: #e53e3e;
            border: 4px solid #ffffff;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: #c53030;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        #gameOverScreen {
            display: none;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">SCORE: <span id="score">000000</span></div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <h1>2D PIXEL FLIGHT</h1>
        <p>[W/S or UP/DOWN] TO FLY</p>
        <button onclick="startGame()">PRESS START</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen">
        <h1 style="color: #e53e3e; text-shadow: 3px 3px 0px #000000;">GAME OVER</h1>
        <p>FINAL SCORE: <span id="finalScore">0</span></p>
        <button onclick="startGame()">TRY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // Controls
    const keys = { ArrowUp: false, ArrowDown: false, w: false, s: false };

    window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    // Internal Pixel Resolution for Pixel-Art Effect
    const GAME_WIDTH = 480;
    const GAME_HEIGHT = 270;

    function resizeCanvas() {
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
    }
    resizeCanvas();

    // Game State variables
    let gameRunning = false;
    let score = 0;
    let speed = 2;
    let frameCount = 0;

    // Entities
    let player = {
        x: 60,
        y: GAME_HEIGHT / 2 - 10,
        width: 24,
        height: 12,
        vy: 0,
        speed: 2.5
    };

    let obstacles = [];
    let clouds = [];
    let mountains = [];

    // Background Layers Setup
    function initBackground() {
        clouds = [];
        mountains = [];

        // Generate Clouds
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * (GAME_HEIGHT / 2 - 40),
                width: 30 + Math.random() * 30,
                speed: 0.3 + Math.random() * 0.3
            });
        }

        // Generate Mountains
        for (let i = 0; i < 7; i++) {
            mountains.push({
                x: i * 80,
                height: 40 + Math.random() * 30,
                width: 90
            });
        }
    }

    function spawnObstacle() {
        const height = Math.floor(Math.random() * 20) + 16;
        const y = Math.floor(Math.random() * (GAME_HEIGHT - 60 - height)) + 20;
        obstacles.push({
            x: GAME_WIDTH,
            y: y,
            width: 16,
            height: height,
            color: '#d69e2e' // Steel / Yellowish crate color
        });
    }

    function startGame() {
        obstacles = [];
        player.y = GAME_HEIGHT / 2 - 10;
        player.vy = 0;
        score = 0;
        speed = 2;
        frameCount = 0;
        scoreEl.textContent = '000000';

        initBackground();

        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        gameRunning = true;

        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameRunning = false;
        finalScoreEl.textContent = score;
        gameOverScreen.style.display = 'flex';
    }

    function update() {
        frameCount++;
        score += 1;
        scoreEl.textContent = String(score).padStart(6, '0');

        // Increase speed gradually
        speed = 2 + Math.floor(score / 500) * 0.5;

        // Player movement
        if (keys.ArrowUp || keys.w) player.y -= player.speed;
        if (keys.ArrowDown || keys.s) player.y += player.speed;

        // Keep player in bounds
        if (player.y < 10) player.y = 10;
        if (player.y > GAME_HEIGHT - 35) player.y = GAME_HEIGHT - 35;

        // Parallax Clouds
        clouds.forEach(c => {
            c.x -= c.speed;
            if (c.x + c.width < 0) {
                c.x = GAME_WIDTH;
                c.y = Math.random() * (GAME_HEIGHT / 2 - 40);
            }
        });

        // Parallax Mountains
        mountains.forEach(m => {
            m.x -= speed * 0.3;
            if (m.x + m.width < 0) {
                m.x = GAME_WIDTH;
                m.height = 40 + Math.random() * 30;
            }
        });

        // Spawn obstacles
        if (frameCount % Math.max(30, 90 - Math.floor(speed * 5)) === 0) {
            spawnObstacle();
        }

        // Update obstacles & collision check
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= speed;

            // AABB Collision Detection
            if (
                player.x < obs.x + obs.width &&
                player.x + player.width > obs.x &&
                player.y < obs.y + obs.height &&
                player.y + player.height > obs.y
            ) {
                endGame();
                return;
            }

            // Remove off-screen obstacles
            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
            }
        }
    }

    function draw() {
        // 1. Realistic Sky Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        skyGrad.addColorStop(0, '#63b3ed');   // Bright sky blue
        skyGrad.addColorStop(0.7, '#ebf8ff'); // Soft horizon light
        skyGrad.addColorStop(1, '#38a169');   // Ground green
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 2. Pixel Clouds
        ctx.fillStyle = '#ffffff';
        clouds.forEach(c => {
            ctx.fillRect(Math.floor(c.x), Math.floor(c.y), c.width, 10);
            ctx.fillRect(Math.floor(c.x + 4), Math.floor(c.y - 4), c.width - 8, 6);
        });

        // 3. Mountains (Background)
        ctx.fillStyle = '#718096'; // Slate grey
        mountains.forEach(m => {
            ctx.beginPath();
            ctx.moveTo(Math.floor(m.x), GAME_HEIGHT - 20);
            ctx.lineTo(Math.floor(m.x + m.width / 2), GAME_HEIGHT - 20 - m.height);
            ctx.lineTo(Math.floor(m.x + m.width), GAME_HEIGHT - 20);
            ctx.fill();
        });

        // 4. Ground (Green Field & Brown Earth)
        ctx.fillStyle = '#2f855a'; // Deep grass green
        ctx.fillRect(0, GAME_HEIGHT - 20, GAME_WIDTH, 6);
        ctx.fillStyle = '#744210'; // Dirt brown
        ctx.fillRect(0, GAME_HEIGHT - 14, GAME_WIDTH, 14);

        // 5. Draw Player Airplane (Red & White Prop Plane)
        const px = Math.floor(player.x);
        const py = Math.floor(player.y);

        // Fuselage (Red)
        ctx.fillStyle = '#e53e3e';
        ctx.fillRect(px, py + 4, 20, 5);

        // Cockpit Window (Cyan glass)
        ctx.fillStyle = '#63b3ed';
        ctx.fillRect(px + 10, py + 2, 5, 3);

        // Wings (White)
        ctx.fillStyle = '#edf2f7';
        ctx.fillRect(px + 8, py, 4, 12);

        // Tail (Darker Red)
        ctx.fillStyle = '#9b2c2c';
        ctx.fillRect(px, py + 1, 4, 4);

        // Propeller (Grey)
        ctx.fillStyle = '#a0aec0';
        ctx.fillRect(px + 21, py + 2, 1, 8);

        // 6. Draw Obstacles (Wooden / Metal Crates)
        obstacles.forEach(obs => {
            const ox = Math.floor(obs.x);
            const oy = Math.floor(obs.y);

            ctx.fillStyle = obs.color;
            ctx.fillRect(ox, oy, obs.width, obs.height);

            // Darker border for 2D depth
            ctx.strokeStyle = '#744210';
            ctx.lineWidth = 1;
            ctx.strokeRect(ox + 0.5, oy + 0.5, obs.width - 1, obs.height - 1);
        });
    }

    function gameLoop() {
        if (!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
