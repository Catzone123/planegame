<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DOGFIGHTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #ffffff;
            font-size: 16px;
            text-shadow: 2px 2px 0px #000000;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 2px;
            display: flex;
            gap: 30px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 25, 35, 0.85);
            color: #ffffff;
            z-index: 20;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #2d3748;
            text-align: center;
            line-height: 1.4;
            color: #48bb78;
        }

        p {
            font-size: 12px;
            margin-bottom: 30px;
            color: #e2e8f0;
            text-shadow: 1px 1px 0px #000000;
            text-align: center;
            line-height: 1.6;
        }

        button {
            padding: 16px 28px;
            font-size: 14px;
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
            background: #e53e3e;
            border: 4px solid #ffffff;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: #c53030;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        #gameOverScreen {
            display: none;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div>SCORE: <span id="score">000000</span></div>
        <div>HP: <span id="hp">3</span></div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <h1>2D PIXEL DOGFIGHT</h1>
        <p>[W/S or UP/DOWN] TO MOVE<br><br>[SPACEBAR] TO SHOOT</p>
        <button onclick="startGame()">PRESS START</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen">
        <h1 style="color: #e53e3e; text-shadow: 3px 3px 0px #000000;">GAME OVER</h1>
        <p>FINAL SCORE: <span id="finalScore">0</span></p>
        <button onclick="startGame()">TRY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreEl = document.getElementById('score');
    const hpEl = document.getElementById('hp');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // Controls
    const keys = { ArrowUp: false, ArrowDown: false, w: false, s: false, ' ': false };

    window.addEventListener('keydown', (e) => { 
        if (e.key in keys || e.key === ' ') {
            keys[e.key] = true; 
        }
    });
    window.addEventListener('keyup', (e) => { 
        if (e.key in keys || e.key === ' ') {
            keys[e.key] = false; 
        }
    });

    // Internal Pixel Resolution
    const GAME_WIDTH = 480;
    const GAME_HEIGHT = 270;

    function resizeCanvas() {
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
    }
    resizeCanvas();

    // Game State variables
    let gameRunning = false;
    let score = 0;
    let frameCount = 0;
    let lastShootFrame = 0;

    // Entities
    let player = {
        x: 40,
        y: GAME_HEIGHT / 2 - 10,
        width: 24,
        height: 12,
        speed: 2.5,
        hp: 3
    };

    let playerBullets = [];
    let enemies = [];
    let enemyBullets = [];
    let clouds = [];
    let mountains = [];

    // Background Setup
    function initBackground() {
        clouds = [];
        mountains = [];

        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * (GAME_HEIGHT / 2 - 40),
                width: 30 + Math.random() * 30,
                speed: 0.3 + Math.random() * 0.3
            });
        }

        for (let i = 0; i < 7; i++) {
            mountains.push({
                x: i * 80,
                height: 40 + Math.random() * 30,
                width: 90
            });
        }
    }

    function spawnEnemy() {
        const y = Math.floor(Math.random() * (GAME_HEIGHT - 70)) + 20;
        enemies.push({
            x: GAME_WIDTH,
            y: y,
            width: 22,
            height: 12,
            speed: 1.2 + Math.random() * 0.8,
            hp: 2,
            lastShot: frameCount
        });
    }

    function startGame() {
        enemies = [];
        playerBullets = [];
        enemyBullets = [];
        
        player.y = GAME_HEIGHT / 2 - 10;
        player.hp = 3;
        score = 0;
        frameCount = 0;
        lastShootFrame = 0;
        
        scoreEl.textContent = '000000';
        hpEl.textContent = player.hp;

        initBackground();

        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        gameRunning = true;

        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameRunning = false;
        finalScoreEl.textContent = score;
        gameOverScreen.style.display = 'flex';
    }

    function isColliding(a, b) {
        return (
            a.x < b.x + b.width &&
            a.x + a.width > b.x &&
            a.y < b.y + b.height &&
            a.y + a.height > b.y
        );
    }

    function update() {
        frameCount++;
        scoreEl.textContent = String(score).padStart(6, '0');
        hpEl.textContent = player.hp;

        // Player Movement
        if (keys.ArrowUp || keys.w) player.y -= player.speed;
        if (keys.ArrowDown || keys.s) player.y += player.speed;

        // Bound player inside sky area
        if (player.y < 10) player.y = 10;
        if (player.y > GAME_HEIGHT - 40) player.y = GAME_HEIGHT - 40;

        // Player Shooting (Cooldown: 12 frames)
        if (keys[' '] && frameCount - lastShootFrame > 12) {
            playerBullets.push({
                x: player.x + player.width,
                y: player.y + player.height / 2 - 1,
                width: 6,
                height: 2,
                speed: 5
            });
            lastShootFrame = frameCount;
        }

        // Parallax Clouds
        clouds.forEach(c => {
            c.x -= c.speed;
            if (c.x + c.width < 0) {
                c.x = GAME_WIDTH;
                c.y = Math.random() * (GAME_HEIGHT / 2 - 40);
            }
        });

        // Parallax Mountains
        mountains.forEach(m => {
            m.x -= 0.6;
            if (m.x + m.width < 0) {
                m.x = GAME_WIDTH;
                m.height = 40 + Math.random() * 30;
            }
        });

        // Spawn Enemy Planes
        if (frameCount % Math.max(40, 120 - Math.floor(score / 100)) === 0) {
            spawnEnemy();
        }

        // Update Player Bullets
        for (let i = playerBullets.length - 1; i >= 0; i--) {
            let b = playerBullets[i];
            b.x += b.speed;

            if (b.x > GAME_WIDTH) {
                playerBullets.splice(i, 1);
                continue;
            }

            // Check hit against enemy NPCs
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (isColliding(b, e)) {
                    e.hp--;
                    playerBullets.splice(i, 1);

                    if (e.hp <= 0) {
                        enemies.splice(j, 1);
                        score += 100;
                    }
                    break;
                }
            }
        }

        // Update Enemies & Enemy Bullets
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            e.x -= e.speed;

            // Enemy NPC Shooting AI (shoots every 90-120 frames)
            if (frameCount - e.lastShot > 90 + Math.random() * 30 && e.x > player.x + 50) {
                enemyBullets.push({
                    x: e.x,
                    y: e.y + e.height / 2 - 1,
                    width: 5,
                    height: 2,
                    speed: 3.5
                });
                e.lastShot = frameCount;
            }

            // Player ramming enemy plane
            if (isColliding(player, e)) {
                player.hp--;
                enemies.splice(j, 1);
                if (player.hp <= 0) endGame();
                continue;
            }

            // Remove off-screen enemies
            if (e.x + e.width < 0) {
                enemies.splice(j, 1);
            }
        }

        // Update Enemy Bullets
        for (let k = enemyBullets.length - 1; k >= 0; k--) {
            let eb = enemyBullets[k];
            eb.x -= eb.speed;

            // Check hit on Player
            if (isColliding(eb, player)) {
                player.hp--;
                enemyBullets.splice(k, 1);
                if (player.hp <= 0) endGame();
                continue;
            }

            if (eb.x < 0) {
                enemyBullets.splice(k, 1);
            }
        }
    }

    function draw() {
        // 1. Sky Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        skyGrad.addColorStop(0, '#63b3ed');
        skyGrad.addColorStop(0.7, '#ebf8ff');
        skyGrad.addColorStop(1, '#38a169');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 2. Clouds
        ctx.fillStyle = '#ffffff';
        clouds.forEach(c => {
            ctx.fillRect(Math.floor(c.x), Math.floor(c.y), c.width, 10);
            ctx.fillRect(Math.floor(c.x + 4), Math.floor(c.y - 4), c.width - 8, 6);
        });

        // 3. Mountains
        ctx.fillStyle = '#718096';
        mountains.forEach(m => {
            ctx.beginPath();
            ctx.moveTo(Math.floor(m.x), GAME_HEIGHT - 20);
            ctx.lineTo(Math.floor(m.x + m.width / 2), GAME_HEIGHT - 20 - m.height);
            ctx.lineTo(Math.floor(m.x + m.width), GAME_HEIGHT - 20);
            ctx.fill();
        });

        // 4. Ground
        ctx.fillStyle = '#2f855a';
        ctx.fillRect(0, GAME_HEIGHT - 20, GAME_WIDTH, 6);
        ctx.fillStyle = '#744210';
        ctx.fillRect(0, GAME_HEIGHT - 14, GAME_WIDTH, 14);

        // 5. Draw Player Plane (Red)
        const px = Math.floor(player.x);
        const py = Math.floor(player.y);

        ctx.fillStyle = '#e53e3e';
        ctx.fillRect(px, py + 4, 20, 5);
        ctx.fillStyle = '#63b3ed';
        ctx.fillRect(px + 10, py + 2, 5, 3);
        ctx.fillStyle = '#edf2f7';
        ctx.fillRect(px + 8, py, 4, 12);
        ctx.fillStyle = '#9b2c2c';
        ctx.fillRect(px, py + 1, 4, 4);

        // 6. Draw NPC Enemy Planes (Dark Gray/Green Camo)
        enemies.forEach(e => {
            const ex = Math.floor(e.x);
            const ey = Math.floor(e.y);

            // Fuselage
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(ex, ey + 4, 20, 5);
            // Cockpit
            ctx.fillStyle = '#e53e3e';
            ctx.fillRect(ex + 6, ey + 2, 4, 3);
            // Wings
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(ex + 10, ey, 4, 12);
            // Tail
            ctx.fillStyle = '#1a202c';
            ctx.fillRect(ex + 18, ey + 1, 4, 4);
        });

        // 7. Draw Player Bullets (Bright Yellow/Red)
        ctx.fillStyle = '#f6e05e';
        playerBullets.forEach(b => {
            ctx.fillRect(Math.floor(b.x), Math.floor(b.y), b.width, b.height);
        });

        // 8. Draw Enemy Bullets (Orange/Red)
        ctx.fillStyle = '#dd6b20';
        enemyBullets.forEach(eb => {
            ctx.fillRect(Math.floor(eb.x), Math.floor(eb.y), eb.width, eb.height);
        });
    }

    function gameLoop() {
        if (!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
