<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyansh's Plane Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #87CEEB;
        }

        /* Controls guide overlay */
        #controls-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-family: sans-serif;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div id="controls-hint">Controls: Arrow Keys / WASD to Move | SPACE to Shoot</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let score = 4500;
let lives = 3;
let health = 5;
let stage = 1;
let gameOver = false;

// Input handling
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Player Object
const player = {
    x: 100,
    y: 250,
    width: 70,
    height: 35,
    speed: 5,
    lastShot: 0,
    shootDelay: 150
};

// Arrays for entities
let bullets = [];
let enemies = [];
let explosions = [];
let clouds = [];
let mountains = [];

// Initialize background scenery
for (let i = 0; i < 5; i++) {
    clouds.push({
        x: Math.random() * canvas.width,
        y: Math.random() * 180,
        radius: 30 + Math.random() * 25,
        speed: 0.5 + Math.random() * 0.5
    });
}

for (let i = 0; i < 4; i++) {
    mountains.push({
        x: i * 300,
        width: 320,
        height: 180 + Math.random() * 60
    });
}

// Enemy Spawner
let enemyTimer = 0;
function spawnEnemy() {
    enemies.push({
        x: canvas.width + 50,
        y: 80 + Math.random() * (canvas.height - 220),
        width: 55,
        height: 30,
        speed: 2 + Math.random() * 2,
        health: 2
    });
}

// Draw Red Player Plane
function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Main Body (Red)
    ctx.fillStyle = '#D32F2F';
    ctx.beginPath();
    ctx.ellipse(20, 15, 35, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wings
    ctx.fillStyle = '#B71C1C';
    ctx.beginPath();
    ctx.ellipse(15, 15, 12, 30, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#81D4FA';
    ctx.beginPath();
    ctx.ellipse(25, 10, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tail Fin
    ctx.fillStyle = '#B71C1C';
    ctx.beginPath();
    ctx.moveTo(-10, 10);
    ctx.lineTo(-25, -5);
    ctx.lineTo(-15, 12);
    ctx.closePath();
    ctx.fill();

    // Muzzle Fire animation when holding space
    if (keys['Space']) {
        ctx.fillStyle = '#FF9800';
        ctx.beginPath();
        ctx.arc(58, 15, 6 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

// Draw Gray Enemy Biplane
function drawEnemy(enemy) {
    ctx.save();
    ctx.translate(enemy.x, enemy.y);

    // Fuselage
    ctx.fillStyle = '#546E7A';
    ctx.fillRect(0, 8, 45, 12);

    // Top & Bottom Wings (Biplane)
    ctx.fillStyle = '#37474F';
    ctx.fillRect(10, -2, 30, 5);
    ctx.fillRect(10, 22, 30, 5);

    // Wing Struts
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(15, 3); ctx.lineTo(15, 22);
    ctx.moveTo(35, 3); ctx.lineTo(35, 22);
    ctx.stroke();

    // Red Sun Emblem
    ctx.fillStyle = '#D32F2F';
    ctx.beginPath();
    ctx.arc(25, 0, 3, 0, Math.PI * 2);
    ctx.arc(25, 24, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// Main Game Loop
function update() {
    if (gameOver) return;

    // Movement Controls
    if ((keys['ArrowUp'] || keys['KeyW']) && player.y > 50) player.y -= player.speed;
    if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - 100) player.y += player.speed;
    if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 30) player.x -= player.speed;
    if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - 100) player.x += player.speed;

    // Shooting
    const now = Date.now();
    if (keys['Space'] && now - player.lastShot > player.shootDelay) {
        bullets.push({
            x: player.x + 55,
            y: player.y + 15,
            speed: 12
        });
        player.lastShot = now;
    }

    // Update Bullets
    bullets.forEach((b, index) => {
        b.x += b.speed;
        if (b.x > canvas.width) bullets.splice(index, 1);
    });

    // Spawn Enemies
    enemyTimer++;
    if (enemyTimer > 80) {
        spawnEnemy();
        enemyTimer = 0;
    }

    // Update Enemies & Collision
    enemies.forEach((enemy, eIndex) => {
        enemy.x -= enemy.speed;

        // Collision with player bullets
        bullets.forEach((bullet, bIndex) => {
            if (
                bullet.x > enemy.x &&
                bullet.x < enemy.x + enemy.width &&
                bullet.y > enemy.y &&
                bullet.y < enemy.y + enemy.height
            ) {
                enemy.health--;
                bullets.splice(bIndex, 1);

                if (enemy.health <= 0) {
                    // Trigger Explosion
                    explosions.push({
                        x: enemy.x + enemy.width / 2,
                        y: enemy.y + enemy.height / 2,
                        radius: 10,
                        maxRadius: 35,
                        text: "KABOOM!"
                    });
                    score += 100;
                    enemies.splice(eIndex, 1);
                }
            }
        });

        // Collision with player
        if (
            player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y
        ) {
            explosions.push({
                x: enemy.x,
                y: enemy.y,
                radius: 20,
                maxRadius: 30,
                text: "HIT!"
            });
            enemies.splice(eIndex, 1);
            health--;
            if (health <= 0) {
                lives--;
                health = 5;
                if (lives <= 0) gameOver = true;
            }
        }

        // Remove off-screen enemies
        if (enemy.x < -60) enemies.splice(eIndex, 1);
    });

    // Background scrolling
    mountains.forEach(m => {
        m.x -= 1;
        if (m.x + m.width < 0) m.x = canvas.width;
    });

    clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -50) c.x = canvas.width + 50;
    });
}

function render() {
    // 1. Sky & Sea Background
    ctx.fillStyle = '#7AC5CD';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sea
    ctx.fillStyle = '#2E7D32';
    ctx.fillRect(0, canvas.height - 140, canvas.width, 140);
    ctx.fillStyle = '#1565C0';
    ctx.fillRect(0, canvas.height - 90, canvas.width, 90);

    // 2. Mountains Scenery
    ctx.fillStyle = '#4CAF50';
    mountains.forEach(m => {
        ctx.beginPath();
        ctx.moveTo(m.x, canvas.height - 90);
        ctx.lineTo(m.x + m.width / 2, canvas.height - m.height);
        ctx.lineTo(m.x + m.width, canvas.height - 90);
        ctx.closePath();
        ctx.fill();
    });

    // 3. Clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.arc(c.x + 20, c.y - 10, c.radius * 0.7, 0, Math.PI * 2);
        ctx.arc(c.x + 35, c.y, c.radius * 0.8, 0, Math.PI * 2);
        ctx.fill();
    });

    // 4. Render Player & Enemies
    drawPlayer();
    enemies.forEach(drawEnemy);

    // 5. Render Bullets
    bullets.forEach(b => {
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, 8, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFEB3B';
        ctx.beginPath();
        ctx.ellipse(b.x - 2, b.y, 5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
    });

    // 6. Explosions
    explosions.forEach((exp, index) => {
        ctx.save();
        ctx.fillStyle = '#FF3D00';
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFEA00';
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, exp.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();

        // Explosion Text (KABOOM!)
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#8B0000';
        ctx.lineWidth = 3;
        ctx.font = 'bold 22px Arial';
        ctx.strokeText(exp.text, exp.x - 45, exp.y - exp.radius - 5);
        ctx.fillText(exp.text, exp.x - 45, exp.y - exp.radius - 5);
        ctx.restore();

        exp.radius += 2;
        if (exp.radius > exp.maxRadius) {
            explosions.splice(index, 1);
        }
    });

    // 7. TOP HUD (Matching the exact layout from image)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(10, 10, 430, 40);

    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = 'black';
    ctx.shadowBlur = 4;
    
    // Left HUD: Title & Stage
    ctx.fillText(`REYANSH'S PLANEGAME - STAGE ${stage}`, 20, 36);

    // Right HUD: Score & Lives
    const formattedScore = String(score).padStart(6, '0');
    ctx.fillText(`SCORE: ${formattedScore} | LIVES: ${lives}`, canvas.width - 380, 36);

    // Health Hearts
    let hearts = '';
    for (let i = 0; i < health; i++) hearts += '💚';
    ctx.fillText(`HEALTH: ${hearts}`, canvas.width - 380, 65);

    ctx.shadowBlur = 0;

    // Game Over Overlay
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#FF5252';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '20px Arial';
        ctx.fillText('Refresh the page to play again', canvas.width / 2, canvas.height / 2 + 30);
    }
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
