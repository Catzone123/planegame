<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyansh's Minecraft Plane Game - Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        canvas {
            display: block;
        }

        /* Minecraft-Style HUD Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            pointer-events: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #3c3c3c;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        #flight-status {
            color: #ffeb3b;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
            box-shadow: 0 0 4px #000;
        }

        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        #controls-overlay {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #555;
            padding: 8px 16px;
            text-align: center;
            border-radius: 4px;
        }
    </style>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-panel">
            <span>REYANSH'S PLANEGAME - STAGE 1 [FPV]</span>
            <span>SCORE: <span id="score">004500</span> | LIVES: <span id="lives">3</span></span>
        </div>
        <div id="flight-status" class="hud-panel">
            <span>STATUS: <span id="status-text">TAKING OFF</span></span>
            <span>LANDING GEAR: <span id="gear-status">DOWN 🛞</span></span>
            <span>HEALTH: <span id="health">💚💚💚💚💚</span></span>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="controls-overlay">
        🕹️ <b>Controls:</b> <b>W/S</b> or <b>Up/Down</b> (Pitch Up/Down) | <b>A/D</b> or <b>Left/Right</b> (Steer/Roll) | <b>G</b> (Landing Gear) | <b>SPACE</b> (Shoot Fireballs)
    </div>
</div>

<script>
// --- SCENE & CAMERA SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee); // Minecraft Sky Blue
scene.fog = new THREE.Fog(0x7ec0ee, 100, 350);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
document.getElementById('game-container').appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(50, 150, 50);
scene.add(sunLight);

// --- MATERIALS ---
function mat(color) {
    return new THREE.MeshLambertMaterial({ color: color, flatShading: true });
}

const grassMat  = mat(0x5b8731);
const runwayMat = mat(0x3c3c3c);
const stripeMat = mat(0xffffff);
const woodMat   = mat(0x674a27);
const ironMat   = mat(0x8e8e8e);
const redMat    = mat(0xd32f2f);
const darkMat   = mat(0x222222);
const glassMat  = new THREE.MeshLambertMaterial({ color: 0x99d9ea, transparent: true, opacity: 0.5 });

// --- PLAYER PLANE & COCKPIT ---
const plane = new THREE.Group();

// Dashboard
const dash = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 1.2), woodMat);
dash.position.set(0, -0.6, -1);
plane.add(dash);

// Windshield Frame
const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.8, 2), ironMat);
leftFrame.position.set(-1.4, 0.2, -0.8);
const rightFrame = leftFrame.clone();
rightFrame.position.x = 1.4;
plane.add(leftFrame, rightFrame);

const glassPanel = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.6, 0.1), glassMat);
glassPanel.position.set(0, 0.3, -1.8);
plane.add(glassPanel);

// Landing Gear Group
const landingGearGroup = new THREE.Group();
const strutGeo = new THREE.BoxGeometry(0.2, 1.2, 0.2);
const wheelGeo = new THREE.BoxGeometry(0.6, 0.6, 0.3);

const leftWheel = new THREE.Mesh(wheelGeo, darkMat);
leftWheel.position.set(-1.2, -1.6, -0.5);
const rightWheel = leftWheel.clone();
rightWheel.position.x = 1.2;

landingGearGroup.add(leftWheel, rightWheel);
plane.add(landingGearGroup);

scene.add(plane);

// Lock FPV Camera to Pilot Seat
camera.position.set(0, 0.2, 0);
plane.add(camera);

// --- AIRPORT RUNWAY & TERRAIN ---
const terrainGroup = new THREE.Group();
const cubeGeo = new THREE.BoxGeometry(4, 4, 4);
const GROUND_Y = -10;

for (let x = -80; x <= 80; x += 4) {
    for (let z = -400; z <= 100; z += 4) {
        let isRunway = (x >= -12 && x <= 12);
        let isStripe = (x === 0 && (Math.abs(z) % 16 < 8));

        let m = isRunway ? (isStripe ? stripeMat : runwayMat) : grassMat;
        let y = isRunway ? GROUND_Y : GROUND_Y + Math.floor(Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2) * 4;

        const block = new THREE.Mesh(cubeGeo, m);
        block.position.set(x, y, z);
        terrainGroup.add(block);
    }
}
scene.add(terrainGroup);

// Initial Position on Runway
plane.position.set(0, GROUND_Y + 3.8, 40);

// --- NPC ENEMY BIPLANES ---
const enemies = [];

function spawnEnemy() {
    const enemy = new THREE.Group();

    // Fuselage
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 5), darkMat);
    enemy.add(body);

    // Biplane Wings
    const wingGeo = new THREE.BoxGeometry(8, 0.2, 1.8);
    const topWing = new THREE.Mesh(wingGeo, ironMat);
    topWing.position.set(0, 1.2, 0);
    const botWing = new THREE.Mesh(wingGeo, ironMat);
    botWing.position.set(0, -0.8, 0);
    enemy.add(topWing, botWing);

    // Red Wings Insignia
    const mark = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.22, 0.8), redMat);
    mark.position.set(2.5, 1.25, 0);
    enemy.add(mark);

    // Position directly ahead of player flight path
    enemy.position.set(
        plane.position.x + (Math.random() - 0.5) * 50,
        plane.position.y + Math.random() * 15 + 2,
        plane.position.z - 150 - Math.random() * 100
    );

    scene.add(enemy);
    enemies.push(enemy);
}

// Spawn initial NPC enemies
for (let i = 0; i < 5; i++) spawnEnemy();

// --- BULLETS SYSTEM ---
const bullets = [];

function fireBullet() {
    const bulletGeo = new THREE.BoxGeometry(0.4, 0.4, 1.2);
    const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });
    const bullet = new THREE.Mesh(bulletGeo, bulletMat);

    // Spawn bullet from plane position
    bullet.position.copy(plane.position);
    bullet.quaternion.copy(plane.quaternion);
    
    // Offset to front of cockpit
    bullet.translateZ(-2);
    bullet.translateY(-0.2);

    scene.add(bullet);
    bullets.push(bullet);
}

// --- KEY CONTROLS ---
const keys = {};
let gearDown = true;
let score = 4500;
let health = 5;

window.addEventListener('keydown', e => {
    keys[e.code] = true;

    // Toggle Landing Gear
    if (e.code === 'KeyG') {
        gearDown = !gearDown;
        landingGearGroup.visible = gearDown;
        document.getElementById('gear-status').innerText = gearDown ? "DOWN 🛞" : "RETRACTED ✈️";
    }

    // Space to Shoot
    if (e.code === 'Space') {
        fireBullet();
    }
});

window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

// --- MAIN GAME LOOP ---
let forwardSpeed = 1.2;

function animate() {
    requestAnimationFrame(animate);

    // 1. PITCH CONTROL (W / S or Up / Down)
    if (keys['KeyW'] || keys['ArrowUp']) {
        plane.rotation.x = THREE.MathUtils.lerp(plane.rotation.x, -0.3, 0.05); // Pitch Up
    } else if (keys['KeyS'] || keys['ArrowDown']) {
        plane.rotation.x = THREE.MathUtils.lerp(plane.rotation.x, 0.3, 0.05);  // Pitch Down
    } else {
        plane.rotation.x = THREE.MathUtils.lerp(plane.rotation.x, 0, 0.05);    // Level Out
    }

    // 2. ROLL / STEER CONTROL (A / D or Left / Right)
    if (keys['KeyA'] || keys['ArrowLeft']) {
        plane.rotation.z = THREE.MathUtils.lerp(plane.rotation.z, 0.4, 0.08);
        plane.rotation.y += 0.015; // Turn Left
    } else if (keys['KeyD'] || keys['ArrowRight']) {
        plane.rotation.z = THREE.MathUtils.lerp(plane.rotation.z, -0.4, 0.08);
        plane.rotation.y -= 0.015; // Turn Right
    } else {
        plane.rotation.z = THREE.MathUtils.lerp(plane.rotation.z, 0, 0.05);
    }

    // 3. MOVE PLANE FORWARD IN 3D DIRECTION
    const forward = new THREE.Vector3(0, 0, -forwardSpeed);
    forward.applyQuaternion(plane.quaternion);
    plane.position.add(forward);

    // 4. LANDING & GROUND ALTITUDE CHECK
    const minAltitude = GROUND_Y + (gearDown ? 3.8 : 2.0);
    if (plane.position.y <= minAltitude) {
        plane.position.y = minAltitude;
        if (plane.rotation.x > 0) plane.rotation.x = 0; // Stop pitching down into runway

        if (!gearDown) {
            document.getElementById('status-text').innerText = "💥 CRASHED! (NO LANDING GEAR)";
        } else {
            document.getElementById('status-text').innerText = "TOUCHDOWN ON RUNWAY 🛬";
        }
    } else {
        document.getElementById('status-text').innerText = "AIRBORNE IN FLIGHT ☁️";
    }

    // 5. UPDATE BULLETS
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        const bForward = new THREE.Vector3(0, 0, -3.0).applyQuaternion(b.quaternion);
        b.position.add(bForward);

        // Check bullet hit on NPC Enemies
        enemies.forEach((enemy, eIdx) => {
            if (b.position.distanceTo(enemy.position) < 4.0) {
                scene.remove(enemy);
                enemies.splice(eIdx, 1);
                scene.remove(b);
                bullets.splice(i, 1);

                score += 100;
                document.getElementById('score').innerText = String(score).padStart(6, '0');
                spawnEnemy(); // Respawn enemy ahead
            }
        });

        if (b && b.position.distanceTo(plane.position) > 250) {
            scene.remove(b);
            bullets.splice(i, 1);
        }
    }

    // 6. UPDATE NPC ENEMIES & RECYCLE
    enemies.forEach((enemy, eIdx) => {
        enemy.position.z += 0.3; // NPC flight speed

        // Collision with player
        if (enemy.position.distanceTo(plane.position) < 4.5) {
            health--;
            document.getElementById('health').innerText = '💚'.repeat(Math.max(0, health));
            scene.remove(enemy);
            enemies.splice(eIdx, 1);
            spawnEnemy();

            if (health <= 0) location.reload();
        }

        // Respawn NPC if it passes behind player
        if (enemy.position.z > plane.position.z + 30) {
            enemy.position.set(
                plane.position.x + (Math.random() - 0.5) * 60,
                plane.position.y + Math.random() * 10,
                plane.position.z - 200
            );
        }
    });

    // Keep terrain tracking endless relative to player
    terrainGroup.position.z = plane.position.z - (plane.position.z % 4);

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
