<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyansh's Minecraft Plane Game - Christmas & Shop Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #70a1ff, #dfe4ea);
        }

        /* --- HUD OVERLAY --- */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border: 2px solid #555;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        #hud h1 {
            font-size: 18px;
            color: #55efc4;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .hud-stat {
            font-size: 14px;
            margin: 4px 0;
            color: #ddd;
        }

        .hud-stat span {
            color: #ffeaa7;
            font-weight: bold;
        }

        .hud-btn {
            margin-top: 10px;
            padding: 8px 14px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background 0.2s;
        }

        .hud-btn:hover {
            background: #74b9ff;
        }

        /* --- MODAL BASE --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #111;
            border: 3px solid #fff;
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            text-align: center;
            max-width: 900px;
            width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            color: #ff7675;
            font-size: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- CHRISTMAS EVENT MODAL --- */
        .christmas-theme {
            border-color: #d63031;
            box-shadow: 0 0 25px rgba(214, 48, 49, 0.8);
            background: #1e0909;
            max-width: 500px;
        }

        .reward-box {
            background: #2d1313;
            border: 2px dashed #55efc4;
            margin: 20px 0;
            padding: 15px;
            font-size: 16px;
            text-align: left;
        }

        .reward-box ul {
            list-style: none;
        }

        .reward-box li {
            margin: 8px 0;
        }

        #claimXmasBtn {
            background: #00b894;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        #claimXmasBtn:hover {
            background: #55efc4;
            color: #000;
        }

        /* --- SHOP MODAL --- */
        .shop-theme {
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-right: 30px;
        }

        #coinDisplay {
            font-size: 18px;
            color: #fdcb6e;
            font-weight: bold;
        }

        .tier-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tier-filters button {
            background: #2d3436;
            color: #fff;
            border: 1px solid #636e72;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        .tier-filters button:hover {
            background: #0984e3;
        }

        .planes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            overflow-y: auto;
            max-height: 55vh;
            padding: 10px;
            background: #000;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .plane-card {
            background: #1e272e;
            border: 2px solid #485460;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .plane-card.tier-F { border-color: #b2bec3; }
        .plane-card.tier-D { border-color: #55efc4; }
        .plane-card.tier-C { border-color: #74b9ff; }
        .plane-card.tier-B { border-color: #a29bfe; }
        .plane-card.tier-A { border-color: #fdcb6e; }
        .plane-card.tier-S { border-color: #ff7675; box-shadow: 0 0 10px rgba(255, 118, 117, 0.4); }

        .buy-btn {
            background: #0984e3;
            color: #fff;
            border: none;
            padding: 6px 10px;
            margin-top: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .buy-btn:hover {
            background: #74b9ff;
        }

        .buy-btn.owned {
            background: #00b894;
            cursor: default;
        }

        .buy-btn.equipped {
            background: #fdcb6e;
            color: #000;
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD OVERLAY -->
    <div id="hud">
        <h1>✈️ Reyansh's Plane Game</h1>
        <div class="hud-stat">R-Coins: <span id="hudCoins">0</span> 🪙</div>
        <div class="hud-stat">Active Plane: <span id="hudPlane">Basic Starter</span></div>
        <div class="hud-stat">Controls: <span>Arrow Keys / WASD</span></div>
        <button class="hud-btn" onclick="toggleShop()">🛒 BUY PLANES SHOP</button>
        <button class="hud-btn" style="background:#d63031;" onclick="forceTestChristmas()">🎄 EVENT TEST</button>
    </div>

    <!-- CHRISTMAS EVENT MODAL -->
    <div id="christmasModal" class="modal">
        <div class="modal-content christmas-theme">
            <h2>🎄 CHRISTMAS EVENT IS LIVE! 🎁</h2>
            <p style="margin-top: 10px;">Merry Christmas! Claim your holiday event rewards:</p>
            <div class="reward-box">
                <ul>
                    <li>✨ <strong>59,756 R-Coins</strong></li>
                    <li>✈️ <strong>Limited Edition Santa Jet</strong></li>
                </ul>
            </div>
            <button id="claimXmasBtn" onclick="claimChristmasReward()">CLAIM REWARD</button>
        </div>
    </div>

    <!-- PLANE SHOP MODAL -->
    <div id="shopModal" class="modal">
        <div class="modal-content shop-theme">
            <button class="close-btn" onclick="toggleShop()">✕</button>
            <div class="shop-header">
                <h2>✈️ PLANE HANGAR & SHOP (500 PLANES)</h2>
                <div id="coinDisplay">R-Coins: <span id="rCoinsCount">0</span> 🪙</div>
            </div>
            
            <div class="tier-filters">
                <button onclick="filterShop('ALL')">All (500)</button>
                <button onclick="filterShop('F')">F-Tier (50)</button>
                <button onclick="filterShop('D')">D-Tier (150)</button>
                <button onclick="filterShop('C')">C-Tier (150)</button>
                <button onclick="filterShop('B')">B-Tier (50)</button>
                <button onclick="filterShop('A')">A-Tier (50)</button>
                <button onclick="filterShop('S')">S-Tier (50)</button>
            </div>

            <div id="planesGrid" class="planes-grid"></div>
        </div>
    </div>

    <script>
        // --- PLAYER DATA & STATE ---
        let playerStats = {
            rCoins: 0,
            ownedPlanes: ['starter_1'],
            equippedPlane: 'starter_1',
            claimedXmas: false
        };

        // --- GENERATE 500 PLANES (50 F, 150 D, 150 C, 50 B, 50 A, 50 S) ---
        const tierDefinitions = [
            { name: 'F', count: 50, basePrice: 100, speedMult: 1.0, color: '#b2bec3' },
            { name: 'D', count: 150, basePrice: 500, speedMult: 1.2, color: '#55efc4' },
            { name: 'C', count: 150, basePrice: 1500, speedMult: 1.5, color: '#74b9ff' },
            { name: 'B', count: 50, basePrice: 5000, speedMult: 2.0, color: '#a29bfe' },
            { name: 'A', count: 50, basePrice: 15000, speedMult: 2.8, color: '#fdcb6e' },
            { name: 'S', count: 50, basePrice: 50000, speedMult: 4.0, color: '#ff7675' }
        ];

        let allPlanes = [
            { id: 'starter_1', name: 'Starter Plane', tier: 'F', price: 0, speed: 4, color: '#ffffff' }
        ];

        let planeCounter = 1;
        tierDefinitions.forEach(tier => {
            for (let i = 1; i <= tier.count; i++) {
                allPlanes.push({
                    id: `plane_${planeCounter}`,
                    name: `${tier.name}-Class Plane #${i}`,
                    tier: tier.name,
                    price: Math.floor(tier.basePrice * (1 + (i * 0.04))),
                    speed: 4 + Math.floor(tier.speedMult * 2) + Math.floor(i * 0.1),
                    color: tier.color
                });
                planeCounter++;
            }
        });

        // Limited Edition Event Plane
        const xmasPlane = {
            id: 'plane_xmas_santa',
            name: '🎄 Santa Sleigh Jet',
            tier: 'S',
            price: 0,
            speed: 16,
            color: '#d63031'
        };
        allPlanes.push(xmasPlane);

        // --- CHRISTMAS EVENT LOGIC ---
        function checkChristmasEvent() {
            const today = new Date();
            // Month 11 is December (0-indexed)
            const isDec25 = (today.getMonth() === 11 && today.getDate() === 25);

            if (isDec25 && !playerStats.claimedXmas) {
                document.getElementById('christmasModal').style.display = 'flex';
            }
        }

        function forceTestChristmas() {
            document.getElementById('christmasModal').style.display = 'flex';
        }

        function claimChristmasReward() {
            playerStats.rCoins += 59756;
            if (!playerStats.ownedPlanes.includes(xmasPlane.id)) {
                playerStats.ownedPlanes.push(xmasPlane.id);
            }
            playerStats.equippedPlane = xmasPlane.id;
            playerStats.claimedXmas = true;

            document.getElementById('christmasModal').style.display = 'none';
            updateUI();
            alert("🎁 Claimed 59,756 R-Coins and the Limited Edition Santa Sleigh Jet!");
        }

        // --- SHOP & UI LOGIC ---
        function updateUI() {
            document.getElementById('hudCoins').innerText = playerStats.rCoins.toLocaleString();
            document.getElementById('rCoinsCount').innerText = playerStats.rCoins.toLocaleString();
            
            const activePlaneObj = allPlanes.find(p => p.id === playerStats.equippedPlane);
            document.getElementById('hudPlane').innerText = activePlaneObj ? activePlaneObj.name : 'Unknown';
        }

        function toggleShop() {
            const modal = document.getElementById('shopModal');
            const isHidden = modal.style.display === 'none' || modal.style.display === '';
            modal.style.display = isHidden ? 'flex' : 'none';
            if (isHidden) {
                renderShop('ALL');
            }
        }

        let currentFilter = 'ALL';
        function filterShop(tier) {
            currentFilter = tier;
            renderShop(tier);
        }

        function renderShop(filterTier) {
            const grid = document.getElementById('planesGrid');
            grid.innerHTML = '';

            const filtered = filterTier === 'ALL' 
                ? allPlanes.filter(p => p.id !== 'plane_xmas_santa' || playerStats.ownedPlanes.includes(p.id))
                : allPlanes.filter(p => p.tier === filterTier);

            filtered.forEach(plane => {
                const isOwned = playerStats.ownedPlanes.includes(plane.id);
                const isEquipped = playerStats.equippedPlane === plane.id;

                const card = document.createElement('div');
                card.className = `plane-card tier-${plane.tier}`;
                
                let buttonText = `🪙 ${plane.price.toLocaleString()}`;
                let buttonClass = 'buy-btn';

                if (isEquipped) {
                    buttonText = 'EQUIPPED';
                    buttonClass = 'buy-btn equipped';
                } else if (isOwned) {
                    buttonText = 'EQUIP';
                    buttonClass = 'buy-btn owned';
                }

                card.innerHTML = `
                    <div>
                        <strong style="color: ${plane.color}">${plane.name}</strong><br>
                        <small style="color: #aaa;">Tier: ${plane.tier} | Speed: ${plane.speed}</small>
                    </div>
                    <button class="${buttonClass}" onclick="handlePlaneClick('${plane.id}')">${buttonText}</button>
                `;
                grid.appendChild(card);
            });
        }

        function handlePlaneClick(id) {
            const plane = allPlanes.find(p => p.id === id);
            if (!plane) return;

            const isOwned = playerStats.ownedPlanes.includes(plane.id);

            if (isOwned) {
                playerStats.equippedPlane = plane.id;
                updateUI();
                renderShop(currentFilter);
            } else if (playerStats.rCoins >= plane.price) {
                playerStats.rCoins -= plane.price;
                playerStats.ownedPlanes.push(plane.id);
                playerStats.equippedPlane = plane.id;
                updateUI();
                renderShop(currentFilter);
            } else {
                alert("Not enough R-Coins!");
            }
        }

        // --- GAME ENGINE & CANVAS RENDERING ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Plane position
        let planeX = canvas.width / 2;
        let planeY = canvas.height / 2;
        let angle = 0;

        function updateGame() {
            const currentPlaneObj = allPlanes.find(p => p.id === playerStats.equippedPlane) || allPlanes[0];
            const speed = currentPlaneObj.speed;

            if (keys['arrowleft'] || keys['a']) angle -= 0.05;
            if (keys['arrowright'] || keys['d']) angle += 0.05;

            if (keys['arrowup'] || keys['w']) {
                planeX += Math.cos(angle) * speed;
                planeY += Math.sin(angle) * speed;
            } else {
                planeX += Math.cos(angle) * (speed * 0.4);
                planeY += Math.sin(angle) * (speed * 0.4);
            }

            // Screen loop
            if (planeX < 0) planeX = canvas.width;
            if (planeX > canvas.width) planeX = 0;
            if (planeY < 0) planeY = canvas.height;
            if (planeY > canvas.height) planeY = 0;
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Minecraft-style Blocky Ground Grid
            const tileSize = 64;
            for (let x = 0; x < canvas.width; x += tileSize) {
                for (let y = 0; y < canvas.height; y += tileSize) {
                    ctx.fillStyle = (Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0 ? '#55efc4' : '#00b894';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                    ctx.strokeRect(x, y, tileSize, tileSize);
                }
            }

            // Draw Active Plane
            const currentPlaneObj = allPlanes.find(p => p.id === playerStats.equippedPlane) || allPlanes[0];

            ctx.save();
            ctx.translate(planeX, planeY);
            ctx.rotate(angle);

            // Wing shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(-15, -15, 30, 30);

            // Plane Body (Minecraft Blocky Aesthetic)
            ctx.fillStyle = currentPlaneObj.color;
            ctx.fillRect(-20, -6, 40, 12); // Main body
            ctx.fillRect(-5, -22, 10, 44); // Wings
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(8, -4, 8, 8);   // Cockpit glass

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Initialize Game
        window.addEventListener('load', () => {
            updateUI();
            checkChristmasEvent();
            gameLoop();
        });
    </script>
</body>
</html>
