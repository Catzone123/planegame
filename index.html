<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Plane Flight</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            color: white;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ddd;
        }

        button {
            padding: 15px 32px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: #ff4757;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        #gameOverScreen {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <h1>3D Flight Simulator</h1>
        <p>Use WASD or Arrow Keys to steer your plane</p>
        <button onclick="startGame()">Fly Now</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen">
        <h1>Plane Crashed!</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="startGame()">Try Again</button>
    </div>

    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let planeGroup, obstacles = [];
        let gameRunning = false;
        let score = 0;
        let speed = 1.2;
        let targetX = 0, targetY = 0;

        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };

        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a2a3a);
            scene.fog = new THREE.FogExp2(0x1a2a3a, 0.008);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 5. Build Airplane
            createAirplane();

            // 6. Build Environment Ground Grid
            const gridHelper = new THREE.GridHelper(2000, 100, 0x00d2d3, 0x2e86de);
            gridHelper.position.y = -25;
            scene.add(gridHelper);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
            window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });
        }

        function createAirplane() {
            planeGroup = new THREE.Group();

            // Fuselage (Body)
            const bodyGeo = new THREE.ConeGeometry(1, 4, 8);
            const redMat = new THREE.MeshPhongMaterial({ color: 0xeb4d4b, flatShading: true });
            const body = new THREE.Mesh(bodyGeo, redMat);
            body.rotation.x = Math.PI / 2;
            planeGroup.add(body);

            // Wings
            const wingGeo = new THREE.BoxGeometry(6, 0.1, 1.2);
            const whiteMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
            const wings = new THREE.Mesh(wingGeo, whiteMat);
            wings.position.set(0, 0, 0.2);
            planeGroup.add(wings);

            // Tail
            const tailGeo = new THREE.BoxGeometry(0.1, 1.2, 1);
            const tail = new THREE.Mesh(tailGeo, redMat);
            tail.position.set(0, 0.8, -1.5);
            planeGroup.add(tail);

            scene.add(planeGroup);
        }

        function spawnObstacle() {
            const geo = new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5);
            const mat = new THREE.MeshPhongMaterial({ color: 0xffa502, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);

            // Position ahead in the distance
            mesh.position.x = (Math.random() - 0.5) * 40;
            mesh.position.y = (Math.random() - 0.5) * 30;
            mesh.position.z = planeGroup.position.z - 250;

            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);

            scene.add(mesh);
            obstacles.push(mesh);
        }

        function startGame() {
            // Reset obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];

            // Reset Plane position
            planeGroup.position.set(0, 0, 0);
            targetX = 0;
            targetY = 0;
            score = 0;
            speed = 1.2;

            scoreEl.textContent = score;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            gameRunning = true;
            animate();
        }

        function animate() {
            if (!gameRunning) return;

            requestAnimationFrame(animate);

            // Forward Progress
            planeGroup.position.z -= speed;
            speed += 0.0003; // Slowly speed up
            score = Math.floor(-planeGroup.position.z);
            scoreEl.textContent = score;

            // Smooth Steering Controls
            const moveSpeed = 0.6;
            if (keys.ArrowLeft || keys.a) targetX -= moveSpeed;
            if (keys.ArrowRight || keys.d) targetX += moveSpeed;
            if (keys.ArrowUp || keys.w) targetY += moveSpeed;
            if (keys.ArrowDown || keys.s) targetY -= moveSpeed;

            // Clamp flyable bounds
            targetX = Math.max(-20, Math.min(20, targetX));
            targetY = Math.max(-12, Math.min(18, targetY));

            // Lerp position for smooth flight feel
            planeGroup.position.x += (targetX - planeGroup.position.x) * 0.1;
            planeGroup.position.y += (targetY - planeGroup.position.y) * 0.1;

            // Banking / Pitching Visual Rotations
            planeGroup.rotation.z = (planeGroup.position.x - targetX) * 0.08;
            planeGroup.rotation.x = (targetY - planeGroup.position.y) * 0.05;

            // Smooth Third-Person Camera Follow
            camera.position.x = planeGroup.position.x * 0.5;
            camera.position.y = planeGroup.position.y * 0.5 + 4;
            camera.position.z = planeGroup.position.z + 12;
            camera.lookAt(planeGroup.position.x, planeGroup.position.y, planeGroup.position.z - 10);

            // Spawn Obstacles periodically
            if (Math.random() < 0.2) {
                spawnObstacle();
            }

            // Update & Check Collisions for Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.rotation.x += 0.01;
                obs.rotation.y += 0.01;

                // Simple 3D Distance-based Collision Check
                const dist = planeGroup.position.distanceTo(obs.position);
                if (dist < 2.5) {
                    endGame();
                    return;
                }

                // Clean up passed obstacles behind camera
                if (obs.position.z > camera.position.z) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function endGame() {
            gameRunning = false;
            finalScoreEl.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
