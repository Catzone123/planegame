<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyansh's 3D Plane Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 3D HUD Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            font-family: monospace;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
        }

        #controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: red;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: #ff4444;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
        }

        #game-over button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #ff4444;
            color: white;
            font-weight: bold;
        }
    </style>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-panel">REYANSH'S PLANEGAME - STAGE 1</div>
        <div class="hud-panel">SCORE: <span id="score">004500</span> | LIVES: <span id="lives">3</span></div>
        <div class="hud-panel">HEALTH: <span id="health">❤️❤️❤️❤️❤️</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="controls-overlay">
        🎮 Controls: <b>W/S</b> or <b>Up/Down</b> (Pitch) | <b>A/D</b> or <b>Left/Right</b> (Roll/Turn) | <b>SPACE</b> (Fire Guns)
    </div>

    <div id="game-over">
        <div>GAME OVER</div>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<script>
// --- GAME SETUP & THREE.JS INITIALIZATION ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Sky blue
scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// --- LIGHTING ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(100, 200, 100);
dirLight.castShadow = true;
scene.add(dirLight);

// --- GAME STATE ---
let score = 4500;
let lives = 3;
let health = 5;
let isGameOver = false;

// --- CONTROLS ---
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- TERRAIN CREATION ---
const terrainGroup = new THREE.Group();
const islandGeo = new THREE.PlaneGeometry(1000, 2000, 64, 64);
islandGeo.rotateX(-Math.PI / 2);

// Add height variation for 3D mountains
const pos = islandGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    if (x < 100 && x > -300) {
        const y = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 40 + Math.sin(z * 0.01) * 30;
        pos.setY(i, Math.max(0, y));
    }
}
islandGeo.computeVertexNormals();

const islandMat = new THREE.MeshLambertMaterial({ color: 0x4caf50, flatShading: true });
const terrain = new THREE.Mesh(islandGeo, islandMat);
terrainGroup.add(terrain);

// Water Base
const waterGeo = new THREE.PlaneGeometry(2000, 2000);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.MeshLambertMaterial({ color: 0x1e88e5, transparent: true, opacity: 0.8 });
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = -2;
terrainGroup.add(water);

scene.add(terrainGroup);

// --- BUILD PLAYER 3D PLANE (Red Monoplane) ---
function createPlayerPlane() {
    const plane = new THREE.Group();

    // Body
    const bodyGeo = new THREE.ConeGeometry(1.2, 6, 8);
    bodyGeo.rotateX(Math.PI / 2);
    const redMat = new THREE.MeshLambertMaterial({ color: 0xd32f2f });
    const body = new THREE.Mesh(bodyGeo, redMat);
    plane.add(body);

    // Main Wing
    const wingGeo = new THREE.BoxGeometry(9, 0.1, 1.8);
    const wingMat = new THREE.MeshLambertMaterial({ color: 0xb71c1c });
    const wing = new THREE.Mesh(wingGeo, wingMat);
    wing.position.set(0, 0, 0.5);
    plane.add(wing);

    // Tail Fin
    const tailGeo = new THREE.BoxGeometry(0.1, 1.5, 1);
    const tail = new THREE.Mesh(tailGeo, wingMat);
    tail.position.set(0, 0.8, -2.5);
    plane.add(tail);

    // Cockpit
    const glassGeo = new THREE.SphereGeometry(0.7, 8, 8);
    const glassMat = new THREE.MeshPhongMaterial({ color: 0x81d4fa, transparent: true, opacity: 0.7 });
    const glass = new THREE.Mesh(glassGeo, glassMat);
    glass.position.set(0, 0.5, 0.5);
    glass.scale.set(0.8, 0.8, 1.5);
    plane.add(glass);

    plane.position.set(0, 40, 0);
    return plane;
}

const player = createPlayerPlane();
scene.add(player);

// --- ENEMY CREATION ---
const enemies = [];
function createEnemyPlane() {
    const enemy = new THREE.Group();

    // Fuselage
    const bodyGeo = new THREE.BoxGeometry(1, 1, 4);
    const grayMat = new THREE.MeshLambertMaterial({ color: 0x546e7a });
    const body = new THREE.Mesh(bodyGeo, grayMat);
    enemy.add(body);

    // Biplane Wings
    const wingGeo = new THREE.BoxGeometry(7, 0.1, 1.2);
    const darkMat = new THREE.MeshLambertMaterial({ color: 0x37474f });
    const topWing = new THREE.Mesh(wingGeo, darkMat);
    topWing.position.set(0, 0.8, 0.5);
    const botWing = new THREE.Mesh(wingGeo, darkMat);
    botWing.position.set(0, -0.4, 0.5);
    enemy.add(topWing, botWing);

    enemy.position.set(
        (Math.random() - 0.5) * 80,
        25 + Math.random() * 30,
        player.position.z - 300 - Math.random() * 200
    );

    scene.add(enemy);
    enemies.push(enemy);
}

// Spawn initial enemies
for(let i = 0; i < 5; i++) createEnemyPlane();

// --- BULLETS & EXPLOSIONS ---
const bullets = [];
let lastShot = 0;

function shoot() {
    const now = Date.now();
    if (now - lastShot < 150) return;
    lastShot = now;

    // Dual wing lasers
    [-2, 2].forEach(offset => {
        const bulletGeo = new THREE.CylinderGeometry(0.1, 0.1, 2);
        bulletGeo.rotateX(Math.PI / 2);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
        const bullet = new THREE.Mesh(bulletGeo, bulletMat);

        bullet.position.set(player.position.x + offset, player.position.y, player.position.z - 2);
        scene.add(bullet);
        bullets.push(bullet);
    });
}

// --- GAME LOOP & CONTROLS ---
let forwardSpeed = 0.8;

function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    // Forward constant movement
    player.position.z -= forwardSpeed;
    terrainGroup.position.z = player.position.z - 500; // Endless terrain tracking

    // Flight Dynamics Controls
    if (keys['KeyW'] || keys['ArrowUp']) {
        player.position.y -= 0.4; // Pitch Down
        player.rotation.x = Math.max(player.rotation.x - 0.03, -0.4);
    } else if (keys['KeyS'] || keys['ArrowDown']) {
        player.position.y += 0.4; // Pitch Up
        player.rotation.x = Math.min(player.rotation.x + 0.03, 0.4);
    } else {
        player.rotation.x *= 0.9; // Level out
    }

    if (keys['KeyA'] || keys['ArrowLeft']) {
        player.position.x -= 0.5; // Roll Left
        player.rotation.z = Math.min(player.rotation.z + 0.05, 0.6);
        player.rotation.y += 0.01;
    } else if (keys['KeyD'] || keys['ArrowRight']) {
        player.position.x += 0.5; // Roll Right
        player.rotation.z = Math.max(player.rotation.z - 0.05, -0.6);
        player.rotation.y -= 0.01;
    } else {
        player.rotation.z *= 0.9; // Level out
    }

    // Clamp altitude
    player.position.y = Math.max(5, Math.min(80, player.position.y));
    player.position.x = Math.max(-60, Math.min(60, player.position.x));

    // Shooting
    if (keys['Space']) shoot();

    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.z -= 3;

        // Bullet collision with enemies
        enemies.forEach((enemy, eIdx) => {
            if (b.position.distanceTo(enemy.position) < 4) {
                scene.remove(enemy);
                enemies.splice(eIdx, 1);
                scene.remove(b);
                bullets.splice(i, 1);

                score += 100;
                document.getElementById('score').innerText = String(score).padStart(6, '0');
                createEnemyPlane(); // Respawn new enemy ahead
            }
        });

        if (b && b.position.z < player.position.z - 300) {
            scene.remove(b);
            bullets.splice(i, 1);
        }
    }

    // Update Enemies & Recycle
    enemies.forEach(enemy => {
        // Simple enemy AI behavior
        enemy.position.z += 0.2; 

        // Collision with player
        if (enemy.position.distanceTo(player.position) < 3.5) {
            health--;
            document.getElementById('health').innerText = '❤️'.repeat(Math.max(0, health));
            enemy.position.z = player.position.z - 400; // Reset enemy position
            
            if (health <= 0) {
                lives--;
                health = 5;
                document.getElementById('lives').innerText = lives;
                document.getElementById('health').innerText = '❤️'.repeat(health);
                
                if (lives <= 0) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'flex';
                }
            }
        }

        // Respawn enemy if passed player
        if (enemy.position.z > player.position.z + 20) {
            enemy.position.set(
                (Math.random() - 0.5) * 80,
                25 + Math.random() * 30,
                player.position.z - 350
            );
        }
    });

    // --- 3D CHASE CAMERA SYSTEM (FPV / 3rd Person Follow) ---
    camera.position.x = player.position.x * 0.7;
    camera.position.y = player.position.y + 4;
    camera.position.z = player.position.z + 14;
    camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 20);

    renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
